<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Solid green square background — iOS applies its own rounded corners -->
  <rect width="180" height="180" fill="#16a34a"/>
  <!-- Flag pole -->
  <line x1="90" y1="38" x2="90" y2="142" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="90,38 147,62 90,86" fill="white"/>
  <!-- Hole shadow -->
  <ellipse cx="90" cy="142" rx="25" ry="8" fill="#15803d"/>
  <!-- Golf ball -->
  <circle cx="52" cy="124" r="18" fill="white"/>
  <!-- Dimples -->
  <circle cx="57" cy="118" r="3" fill="#d1fae5"/>
  <circle cx="47" cy="128" r="3" fill="#d1fae5"/>
  <circle cx="61" cy="130" r="2.5" fill="#d1fae5"/>
</svg>
